<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Lingradable — Вход</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html"><i class="fab fa-linux"></i> Lingradable</a>
        </div>
    </nav>

    <main class="container">
        <div class="row justify-content-center mt-5">
            <div class="col-md-5">
                <div class="card">
                    <div class="card-header text-center"><i class="fas fa-sign-in-alt"></i> Вход в систему</div>
                    <div class="card-body">
                        <form>
                            <div class="mb-3">
                                <label class="form-label"><i class="fas fa-envelope"></i> Email</label>
                                <input type="email" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label"><i class="fas fa-lock"></i> Пароль</label>
                                <input type="password" class="form-control" required>
                            </div>
                            <button type="button" class="btn btn-primary w-100"><i class="fas fa-sign-in-alt"></i> Войти</button>
                        </form>
                        <div class="text-center mt-3">
                            <p class="mb-0">Нет аккаунта? <a href="register.html">Зарегистрироваться</a></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="text-center">
        <div class="container"><p><i class="fab fa-linux"></i> © 2026 Lingradable.</p></div>
    </footer>
</body>
</html>
